services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_dev_password
      POSTGRES_DB: enterprise_admin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d enterprise_admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - URL=http://localhost:3000
      - FRONTEND_URL=http://localhost
      - CORS_ORIGIN=http://localhost
      - DATABASE_URL=postgresql://admin:admin_dev_password@postgres:5432/enterprise_admin
      - JWT_ACCESS_SECRET=local-dev-access-secret-32-chars!
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_SECRET=local-dev-refresh-secret-32-chars!
      - JWT_REFRESH_EXPIRES_IN=7d
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./backend/prisma:/app/prisma

  admin-ui:
    build:
      context: .
      dockerfile: admin-ui/Dockerfile
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

  pos-ui:
    build:
      context: .
      dockerfile: pos-ui/Dockerfile
      args:
        VITE_BASE: /pos/
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      # Enable after certificates are issued and nginx.conf listens on 443.
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Certbot/TLS placeholders for production hosts.
      # - ./certbot/www:/var/www/certbot:ro
      # - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - admin-ui
      - pos-ui
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Enable on a production host after replacing example.com.
  # certbot:
  #   image: certbot/certbot
  #   volumes:
  #     - ./certbot/www:/var/www/certbot
  #     - ./certbot/conf:/etc/letsencrypt
  #   command: certonly --webroot --webroot-path=/var/www/certbot --email ops@example.com --agree-tos --no-eff-email -d example.com

volumes:
  pgdata:
