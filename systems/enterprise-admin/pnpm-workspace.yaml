packages:
  - '.'
  - 'packages/*'
  - 'admin-ui'
  - 'pos-ui'

# esbuild needs its native binary installation. MSW's install notice is optional.
onlyBuiltDependencies:
  - esbuild
ignoredBuiltDependencies:
  - msw

# Security compatibility is checked by the dependency regression suite.
overrides:
  minimatch: 11.0.1
  follow-redirects: 1.16.2
