[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deli720w-bluetooth"
version = "0.1.0"
description = "Safe Windows BLE diagnostics and offline label previews for DELI DL-720W NEW"
requires-python = ">=3.11"
dependencies = ["bleak>=0.22", "Pillow>=13,<14", "qrcode>=8", "python-barcode>=0.16"]

[project.scripts]
deli720w = "deli720w.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
