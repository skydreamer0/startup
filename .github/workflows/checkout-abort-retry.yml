name: Checkout abort retry acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-abort-retry:
    name: Checkout abort retry PostgreSQL acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_DB: checkout_order_sequence_ci
          # Only this new, disposable, synthetic-only service uses passwordless auth.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:55436:5432'
        options: >-
          --health-cmd "pg_isready -U test -d checkout_order_sequence_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./systems/enterprise-admin/backend
    env:
      DATABASE_URL: 'postgresql://test@127.0.0.1:55436/checkout_order_sequence_ci'
      ORDER_SEQUENCE_DATABASE_URL: 'postgresql://test@127.0.0.1:55436/checkout_order_sequence_ci'
      ORDER_SEQUENCE_QA_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # This job proves the exact source head; all existing jobs stay unchanged.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: './systems/enterprise-admin/backend/package-lock.json'
      - name: Guard exact source, loopback service and empty owned DB
        id: sequence_preflight
        env:
          ORDER_SEQUENCE_QA_CONTAINER: ${{ job.services.postgres.id }}
          ORDER_SEQUENCE_QA_NETWORK: ${{ job.services.postgres.network }}
        run: node scripts/checkout-retry-ci.mjs preflight
      - name: Install locked backend dependencies and generate Prisma
        run: |
          npm install --global npm@11.21.0
          npm ci
          npm run db:generate
      - name: Validate harness safety and evidence controls
        run: node --experimental-strip-types --test scripts/business-day.test.mjs scripts/order-sequence-ci.test.mjs scripts/checkout-retry-ci.test.mjs
      - name: Run original native harness and bounded checkout retry acceptance
        env:
          ORDER_SEQUENCE_QA_CONTAINER: ${{ job.services.postgres.id }}
          ORDER_SEQUENCE_QA_NETWORK: ${{ job.services.postgres.network }}
        run: node scripts/checkout-retry-ci.mjs run
      - name: Verify zero remaining rows and remove only the owned DB
        if: ${{ always() && steps.sequence_preflight.outcome == 'success' }}
        env:
          ORDER_SEQUENCE_QA_CONTAINER: ${{ job.services.postgres.id }}
          ORDER_SEQUENCE_QA_NETWORK: ${{ job.services.postgres.network }}
        run: node scripts/checkout-retry-ci.mjs cleanup
      - name: Preserve exact-head checkout retry evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkout-abort-retry-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/order-sequence-qa-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 7

