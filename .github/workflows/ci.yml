name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  # No base-branch filter: stacked PRs (based on another feature branch) also get CI.
  pull_request:
  # Manual runs on any branch, so CI can be re-run without pushing empty commits.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the older run; master pushes always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  agent-context:
    name: Agent Context Validation
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Validate agent context files
      run: ./scripts/validate-agent-context.sh

    - name: Validate dependency lock boundaries
      run: node scripts/validate-dependency-locks.mjs

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./systems/enterprise-admin/backend

    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test_db"

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: './systems/enterprise-admin/backend/package-lock.json'

    - name: Setup locked npm
      run: npm install --global npm@11.21.0

    - name: Install Dependencies
      run: npm ci

    - name: Dependency security audit
      run: npm audit --audit-level=low

    - name: Cache Prisma engines
      uses: actions/cache@v6
      with:
        path: ~/.cache/prisma
        key: ${{ runner.os }}-prisma-${{ hashFiles('systems/enterprise-admin/backend/prisma/schema.prisma', 'systems/enterprise-admin/backend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-prisma-

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

    - name: Build backend Docker image
      run: docker build --tag pharmasaas-backend:ci .

    - name: Smoke locked Docker migration CLI
      run: docker run --rm --entrypoint /app/node_modules/.bin/prisma pharmasaas-backend:ci --version

    - name: Setup Test DB
      run: npx prisma migrate deploy

    - name: Seed Test DB
      run: npx prisma db seed

    - name: Run Tests
      run: npm test
      env:
        JWT_ACCESS_SECRET: "test-secret-that-is-at-least-32-chars-long"
        JWT_ACCESS_EXPIRES_IN: "1h"
        JWT_REFRESH_SECRET: "test-refresh-secret-at-least-32-chars!"
        JWT_REFRESH_EXPIRES_IN: "7d"

  admin-ui:
    name: Admin UI CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./systems/enterprise-admin

    steps:
    - uses: actions/checkout@v7

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10.34.6

    - name: Setup Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: 'pnpm'
        cache-dependency-path: './systems/enterprise-admin/pnpm-lock.yaml'

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Dependency security audit
      run: pnpm audit --audit-level=low

    - name: Lint
      run: pnpm --filter admin-ui run lint

    - name: Unit and Render Tests
      run: pnpm --filter admin-ui run test

    - name: Build and Type Check
      run: pnpm --filter admin-ui run build

    - name: Build admin Docker image
      run: docker build --tag pharmasaas-admin:ci --file admin-ui/Dockerfile .

  pos-ui:
    name: POS UI CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: checkout_http_recovery_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d checkout_http_recovery_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./systems/enterprise-admin

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10.34.6

    - name: Setup Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: 'pnpm'
        cache-dependency-path: './systems/enterprise-admin/pnpm-lock.yaml'

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Validate fixed execution UI evidence provenance
      run: node --test pos-ui/e2e/ui-evidence/provenance.test.mjs

    - name: Unit and Component Tests
      run: pnpm --filter pos-ui run test

    - name: Build and Type Check
      run: pnpm --filter pos-ui run build

    - name: Build POS Docker image
      run: docker build --tag pharmasaas-pos:ci --file pos-ui/Dockerfile .

    - name: Prepare real HTTP API for synthetic recovery
      run: |
        npm install --global npm@11.21.0
        npm --prefix backend ci
        npm --prefix backend run db:generate
        npm --prefix backend run build

    - name: Install Chromium for HTTP recovery
      run: pnpm --filter pos-ui exec playwright install --with-deps chromium

    - name: Real HTTP restart and lost-response recovery
      env:
        POS_HTTP_RECOVERY_DATABASE_URL: "postgresql://test:test@127.0.0.1:5432/checkout_http_recovery_ci"
      shell: bash
      run: |
        pnpm --filter pos-ui run test:e2e:http-recovery:types
        pnpm --filter pos-ui run test:e2e:http-recovery 2>&1 | tee pos-ui/http-recovery-ci.txt

    - name: Checkout reviewed scanner UI subject
      uses: actions/checkout@v7
      with:
        ref: 6977e76fb764f83c46369d0eb78ca60c2ecaa5c9
        path: .ui-evidence-subjects/scanner
        persist-credentials: false

    - name: Checkout reviewed supplier UI subject
      uses: actions/checkout@v7
      with:
        ref: 2b2d02a4cd54ed393f32e08ee60bdb35183cdb3d
        path: .ui-evidence-subjects/suppliers
        persist-credentials: false

    - name: Install locked UI subject dependencies
      run: |
        pnpm --dir "$GITHUB_WORKSPACE/.ui-evidence-subjects/scanner/systems/enterprise-admin" install --frozen-lockfile
        pnpm --dir "$GITHUB_WORKSPACE/.ui-evidence-subjects/suppliers/systems/enterprise-admin" install --frozen-lockfile

    - name: Reviewed scanner and supplier browser evidence
      id: reviewed_ui
      shell: bash
      env:
        UI_QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        UI_QA_EXECUTION_SHA: ${{ github.sha }}
        UI_QA_EXECUTION_MODE: ${{ github.event_name == 'pull_request' && 'pr-merge' || 'head' }}
        UI_QA_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      run: node pos-ui/e2e/ui-evidence/run.mjs

    - name: Preserve reviewed UI browser evidence
      if: ${{ always() && steps.reviewed_ui.outputs.evidence_dir != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: reviewed-ui-browser-evidence
        path: ${{ steps.reviewed_ui.outputs.evidence_dir }}
        include-hidden-files: true
        if-no-files-found: error

    - name: Preserve synthetic recovery evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pos-http-recovery
        path: |
          systems/enterprise-admin/pos-ui/test-results-http-recovery/
          systems/enterprise-admin/pos-ui/http-recovery-ci.txt

  products-pagination:
    name: Product pagination PostgreSQL acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_DB: checkout_http_recovery_inventory_pagination_ci
          # Only this new, disposable, synthetic-only service uses passwordless auth.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:55434:5432'
        options: >-
          --health-cmd "pg_isready -U test -d checkout_http_recovery_inventory_pagination_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./systems/enterprise-admin/backend
    env:
      DATABASE_URL: 'postgresql://test@127.0.0.1:55434/checkout_http_recovery_inventory_pagination_ci'
      PRODUCT_PAGINATION_DATABASE_URL: 'postgresql://test@127.0.0.1:55434/checkout_http_recovery_inventory_pagination_ci'
      PAGINATION_QA_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # This job proves the exact source head; the original four jobs stay unchanged.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: './systems/enterprise-admin/backend/package-lock.json'
      - name: Guard exact source, loopback service and empty owned DB
        id: pagination_preflight
        env:
          PAGINATION_QA_CONTAINER: ${{ job.services.postgres.id }}
          PAGINATION_QA_NETWORK: ${{ job.services.postgres.network }}
        run: node scripts/products-pagination-ci.mjs preflight
      - name: Install locked backend dependencies and generate Prisma
        run: |
          npm install --global npm@11.21.0
          npm ci
          npm run db:generate
      - name: Validate harness safety and evidence controls
        run: node --test scripts/products-pagination-ci.test.mjs
      - name: Run original six mocked and eight real PostgreSQL cases
        env:
          PAGINATION_QA_CONTAINER: ${{ job.services.postgres.id }}
          PAGINATION_QA_NETWORK: ${{ job.services.postgres.network }}
        run: node scripts/products-pagination-ci.mjs run
      - name: Verify zero remaining rows and remove only the owned DB
        if: ${{ always() && steps.pagination_preflight.outcome == 'success' }}
        env:
          PAGINATION_QA_CONTAINER: ${{ job.services.postgres.id }}
          PAGINATION_QA_NETWORK: ${{ job.services.postgres.network }}
        run: node scripts/products-pagination-ci.mjs cleanup
      - name: Preserve exact-head pagination evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: products-pagination-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pagination-qa-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 7

  pos-sku-acceptance:
    name: Exact SKU PostgreSQL and current POS browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_DB: checkout_http_recovery_pos_lookup_ci
          # A new disposable synthetic-only service; never an existing/store DB.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:55435:5432'
        options: >-
          --health-cmd "pg_isready -U test -d checkout_http_recovery_pos_lookup_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./systems/enterprise-admin
    env:
      DATABASE_URL: 'postgresql://test@127.0.0.1:55435/checkout_http_recovery_pos_lookup_ci'
      POS_PRODUCT_LOOKUP_DATABASE_URL: 'postgresql://test@127.0.0.1:55435/checkout_http_recovery_pos_lookup_ci'
      SKU_QA_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: './systems/enterprise-admin/backend/package-lock.json'
      - name: Verify exact head and exclusive empty SKU service ownership
        id: sku_preflight
        env:
          SKU_QA_CONTAINER: ${{ job.services.postgres.id }}
          SKU_QA_NETWORK: ${{ job.services.postgres.network }}
        run: node backend/scripts/pos-product-lookup-ci.mjs preflight
      - name: Install canonical locked dependencies
        run: |
          npm exec --yes --package=npm@11.21.0 -- npm --prefix backend ci
          npm --prefix backend run db:generate
          pnpm install --frozen-lockfile
      - name: Validate SKU safety and evidence negative controls
        run: |
          node --test backend/scripts/pos-product-lookup-ci.test.mjs
          node --test pos-ui/e2e/sku-acceptance/run.test.mjs
      - name: Run unchanged five real PostgreSQL SKU cases
        env:
          SKU_QA_CONTAINER: ${{ job.services.postgres.id }}
          SKU_QA_NETWORK: ${{ job.services.postgres.network }}
        run: node backend/scripts/pos-product-lookup-ci.mjs run
      - name: Install Chromium in this disposable runner
        run: pnpm --filter pos-ui exec playwright install --with-deps chromium
      - name: Build and verify current exact-head POS with synthetic HTTP
        run: node pos-ui/e2e/sku-acceptance/run.mjs
      - name: Verify zero rows and drop only the owned SKU database
        if: ${{ always() && steps.sku_preflight.outcome == 'success' }}
        env:
          SKU_QA_CONTAINER: ${{ job.services.postgres.id }}
          SKU_QA_NETWORK: ${{ job.services.postgres.network }}
        run: node backend/scripts/pos-product-lookup-ci.mjs cleanup
      - name: Preserve separate PostgreSQL and current POS evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pos-sku-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sku-qa-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 7

  batch-audit:
    name: Batch audit PostgreSQL acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_DB: checkout_http_recovery_batch_audit_ci
          # Only this new, disposable, synthetic-only service uses passwordless auth.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:55437:5432'
        options: >-
          --health-cmd "pg_isready -U test -d checkout_http_recovery_batch_audit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./systems/enterprise-admin/backend
    env:
      DATABASE_URL: 'postgresql://test@127.0.0.1:55437/checkout_http_recovery_batch_audit_ci'
      BATCH_AUDIT_DATABASE_URL: 'postgresql://test@127.0.0.1:55437/checkout_http_recovery_batch_audit_ci'
      BATCH_AUDIT_QA_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # This job proves the exact source head; the original four jobs stay unchanged.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: './systems/enterprise-admin/backend/package-lock.json'
      - name: Guard exact source, loopback service and empty owned DB
        id: batch_audit_preflight
        env:
          BATCH_AUDIT_QA_CONTAINER: ${{ job.services.postgres.id }}
          BATCH_AUDIT_QA_NETWORK: ${{ job.services.postgres.network }}
        run: node scripts/batch-audit-ci.mjs preflight
      - name: Install locked backend dependencies and generate Prisma
        run: |
          npm install --global npm@11.21.0
          npm ci
          npm run db:generate
      - name: Validate harness safety and evidence controls
        run: node --test scripts/batch-audit-ci.test.mjs
      - name: Run original fifteen native cases and six schema contract cases
        env:
          BATCH_AUDIT_QA_CONTAINER: ${{ job.services.postgres.id }}
          BATCH_AUDIT_QA_NETWORK: ${{ job.services.postgres.network }}
        run: node scripts/batch-audit-ci.mjs run
      - name: Record retained append-only fixtures and remove only the owned DB
        if: ${{ always() && steps.batch_audit_preflight.outcome == 'success' }}
        env:
          BATCH_AUDIT_QA_CONTAINER: ${{ job.services.postgres.id }}
          BATCH_AUDIT_QA_NETWORK: ${{ job.services.postgres.network }}
        run: node scripts/batch-audit-ci.mjs cleanup
      - name: Preserve exact-head batch audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: batch-audit-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/batch-audit-qa-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 7

  order-sequence:
    name: Order sequence PostgreSQL acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_DB: checkout_order_sequence_ci
          # Only this new, disposable, synthetic-only service uses passwordless auth.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:55436:5432'
        options: >-
          --health-cmd "pg_isready -U test -d checkout_order_sequence_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./systems/enterprise-admin/backend
    env:
      DATABASE_URL: 'postgresql://test@127.0.0.1:55436/checkout_order_sequence_ci'
      ORDER_SEQUENCE_DATABASE_URL: 'postgresql://test@127.0.0.1:55436/checkout_order_sequence_ci'
      ORDER_SEQUENCE_QA_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # This job proves the exact source head; all existing jobs stay unchanged.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: './systems/enterprise-admin/backend/package-lock.json'
      - name: Guard exact source, loopback service and empty owned DB
        id: sequence_preflight
        env:
          ORDER_SEQUENCE_QA_CONTAINER: ${{ job.services.postgres.id }}
          ORDER_SEQUENCE_QA_NETWORK: ${{ job.services.postgres.network }}
        run: node scripts/order-sequence-ci.mjs preflight
      - name: Install locked backend dependencies and generate Prisma
        run: |
          npm install --global npm@11.21.0
          npm ci
          npm run db:generate
      - name: Validate harness safety and evidence controls
        run: node --experimental-strip-types --test scripts/business-day.test.mjs scripts/order-sequence-ci.test.mjs
      - name: Run numbering, legacy upgrade and original checkout regressions
        env:
          ORDER_SEQUENCE_QA_CONTAINER: ${{ job.services.postgres.id }}
          ORDER_SEQUENCE_QA_NETWORK: ${{ job.services.postgres.network }}
        run: node scripts/order-sequence-ci.mjs run
      - name: Verify zero remaining rows and remove only the owned DB
        if: ${{ always() && steps.sequence_preflight.outcome == 'success' }}
        env:
          ORDER_SEQUENCE_QA_CONTAINER: ${{ job.services.postgres.id }}
          ORDER_SEQUENCE_QA_NETWORK: ${{ job.services.postgres.network }}
        run: node scripts/order-sequence-ci.mjs cleanup
      - name: Preserve exact-head order sequence evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: order-sequence-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/order-sequence-qa-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 7
