name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./systems/enterprise-admin/backend

    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test_db"

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: './systems/enterprise-admin/backend/package-lock.json'

    - name: Install Dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

    - name: Setup Test DB
      run: npx prisma migrate deploy

    - name: Run Tests
      run: npm test
      env:
        JWT_ACCESS_SECRET: "test-secret-that-is-at-least-32-chars-long"
        JWT_ACCESS_EXPIRES_IN: "1h"
        JWT_REFRESH_SECRET: "test-refresh-secret-at-least-32-chars!"
        JWT_REFRESH_EXPIRES_IN: "7d"

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./systems/enterprise-admin/admin-ui

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: './systems/enterprise-admin/admin-ui/package-lock.json'

    - name: Install Dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build and Type Check
      run: npm run build
