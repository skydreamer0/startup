name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  # No base-branch filter: stacked PRs (based on another feature branch) also get CI.
  pull_request:
  # Manual runs on any branch, so CI can be re-run without pushing empty commits.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the older run; master pushes always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  agent-context:
    name: Agent Context Validation
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Validate agent context files
      run: ./scripts/validate-agent-context.sh

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./systems/enterprise-admin/backend

    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test_db"

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js 18
      uses: actions/setup-node@v7
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: './systems/enterprise-admin/backend/package-lock.json'

    - name: Install Dependencies
      run: npm ci

    - name: Cache Prisma engines
      uses: actions/cache@v6
      with:
        path: ~/.cache/prisma
        key: ${{ runner.os }}-prisma-${{ hashFiles('systems/enterprise-admin/backend/prisma/schema.prisma', 'systems/enterprise-admin/backend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-prisma-

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

    - name: Setup Test DB
      run: npx prisma migrate deploy

    - name: Seed Test DB
      run: npx prisma db seed

    - name: Run Tests
      run: npm test
      env:
        JWT_ACCESS_SECRET: "test-secret-that-is-at-least-32-chars-long"
        JWT_ACCESS_EXPIRES_IN: "1h"
        JWT_REFRESH_SECRET: "test-refresh-secret-at-least-32-chars!"
        JWT_REFRESH_EXPIRES_IN: "7d"

  admin-ui:
    name: Admin UI CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./systems/enterprise-admin

    steps:
    - uses: actions/checkout@v7

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10

    - name: Setup Node.js 20
      uses: actions/setup-node@v7
      with:
        node-version: 20
        cache: 'pnpm'
        cache-dependency-path: './systems/enterprise-admin/pnpm-lock.yaml'

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint
      run: pnpm --filter admin-ui run lint

    - name: Unit and Render Tests
      run: pnpm --filter admin-ui run test

    - name: Build and Type Check
      run: pnpm --filter admin-ui run build

  pos-ui:
    name: POS UI CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: checkout_http_recovery_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d checkout_http_recovery_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./systems/enterprise-admin

    steps:
    - uses: actions/checkout@v7

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10

    - name: Setup Node.js 20
      uses: actions/setup-node@v7
      with:
        node-version: 20
        cache: 'pnpm'
        cache-dependency-path: './systems/enterprise-admin/pnpm-lock.yaml'

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Unit and Component Tests
      run: pnpm --filter pos-ui run test

    - name: Build and Type Check
      run: pnpm --filter pos-ui run build

    - name: Prepare real HTTP API for synthetic recovery
      run: |
        npm --prefix backend ci
        npm --prefix backend run db:generate
        npm --prefix backend run build

    - name: Install Chromium for HTTP recovery
      run: pnpm --filter pos-ui exec playwright install --with-deps chromium

    - name: Real HTTP restart and lost-response recovery
      env:
        POS_HTTP_RECOVERY_DATABASE_URL: "postgresql://test:test@127.0.0.1:5432/checkout_http_recovery_ci"
      shell: bash
      run: |
        pnpm --filter pos-ui run test:e2e:http-recovery:types
        pnpm --filter pos-ui run test:e2e:http-recovery 2>&1 | tee pos-ui/http-recovery-ci.txt

    - name: Preserve synthetic recovery evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pos-http-recovery
        path: |
          systems/enterprise-admin/pos-ui/test-results-http-recovery/
          systems/enterprise-admin/pos-ui/http-recovery-ci.txt
