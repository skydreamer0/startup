name: Category blank-page visibility diagnostic

on:
  push:
    branches: [chore/pos-category-visibility-probe-20261010]

permissions:
  contents: read

jobs:
  blank-page-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify fail-closed diagnostic guards
        run: node --test systems/enterprise-admin/pos-ui/e2e/category-native/session-ownership-probe.test.mjs systems/enterprise-admin/pos-ui/e2e/category-native/owned-run.test.mjs
      - name: Verify preinstalled tools and compare original versus second session
        id: probe
        run: node systems/enterprise-admin/pos-ui/e2e/category-native/session-ownership-probe.mjs
      - name: Preserve successor diagnostic and quiescence evidence
        if: ${{ always() && steps.probe.outputs.evidence_dir != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: category-session-ownership-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.probe.outputs.evidence_dir }}
          if-no-files-found: error
          retention-days: 30
