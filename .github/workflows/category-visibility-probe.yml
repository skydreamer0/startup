name: Category blank-page visibility diagnostic

on:
  push:
    branches: [chore/pos-category-visibility-probe-20261010]

permissions:
  contents: read

jobs:
  blank-page-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.6
      - name: Install canonical locked Playwright workspace
        working-directory: systems/enterprise-admin
        run: pnpm install --frozen-lockfile
      - name: Prepare official pinned Chrome and headed display
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth
          if ! google-chrome --version | grep -Eq '^Google Chrome 154\.0\.8037\.97\b'; then
            package="$RUNNER_TEMP/google-chrome-stable_154.0.8037.97-1_amd64.deb"
            curl --fail --show-error --location --output "$package" https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/google-chrome-stable_154.0.8037.97-1_amd64.deb
            test "$(dpkg-deb --field "$package" Package)" = google-chrome-stable
            test "$(dpkg-deb --field "$package" Version)" = 154.0.8037.97-1
            test "$(dpkg-deb --field "$package" Architecture)" = amd64
            sha256sum "$package"
            sudo apt-get install --no-install-recommends --allow-downgrades -y "$package"
          fi
          google-chrome --version
          google-chrome --version | grep -Eq '^Google Chrome 154\.0\.8037\.97\b'
      - name: Two-arm native visibility diagnostic without POS or DB
        id: probe
        run: node systems/enterprise-admin/pos-ui/e2e/category-native/visibility-probe.mjs
      - name: Preserve raw diagnostic and quiescence evidence
        if: ${{ always() && steps.probe.outputs.evidence_dir != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: category-visibility-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.probe.outputs.evidence_dir }}
          if-no-files-found: error
          retention-days: 30
